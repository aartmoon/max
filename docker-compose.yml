name: tvoy-dom
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tvoydom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tvoydom_demo}
      POSTGRES_DB: ${POSTGRES_DB:-tvoydom}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  gar-init:
    build:
      context: ./gar-init
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-tvoydom}
      POSTGRES_USER: ${POSTGRES_USER:-tvoydom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tvoydom_demo}
      GAR_MODE: demo
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tvoydom}:${POSTGRES_PASSWORD:-tvoydom_demo}@postgres:5432/${POSTGRES_DB:-tvoydom}?sslmode=disable
      PORT: "8080"
      MOCK_STATUS_ENABLED: ${MOCK_STATUS_ENABLED:-true}
      GIS_HOUSING_BASE_URL: ${GIS_HOUSING_BASE_URL:-https://dom.gosuslugi.ru}
      GIS_HOUSING_TIMEOUT: ${GIS_HOUSING_TIMEOUT:-8s}
      GIS_HOUSE_CACHE_TTL: ${GIS_HOUSE_CACHE_TTL:-24h}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_APP_URL: ${MAX_APP_URL:-}
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-}
      MAX_CA_CERT_FILE: ${MAX_CA_CERT_FILE:-}
    volumes:
      - ./certs:/app/certs:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      gar-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
